name: Android

on:
  pull_request:
  push:
    branches: [master, v4]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build only. Unit tests, lint and the emulator suite run on the developer machine with
    # ci/local-test.sh; results live in test-results/.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release and debug APKs
        run: >-
          bash gradlew :app:assembleRelease :app:assembleDebug
          --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks-and-mapping
          path: |
            app/build/outputs/apk
            app/build/outputs/mapping/release
            app/build/outputs/diagnostic-mappings
          if-no-files-found: error

  release:
    # Runs only for version tags, after the build job. Tests run locally (ci/local-test.sh) and their
    # results are committed under test-results/.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android-apks-and-mapping
          path: artifacts
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Release signing secrets are missing: ${missing[*]}. Refusing to publish an unsigned or debug-signed APK."
            exit 1
          fi
      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          unsigned=artifacts/apk/release/app-release-unsigned.apk
          if [[ ! -f "$unsigned" ]]; then
            echo "::error::Expected $unsigned from the build job; found: $(ls artifacts/apk/release 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          version=$("$tools/aapt2" dump badging "$unsigned" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          if [[ "v$version" != "$tag" ]]; then
            echo "::error::Tag $tag does not match the APK versionName $version."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apk="dist/MinTube-$tag.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk" "$apk.idsig"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/signature.txt
          if grep -q 'CN=Android Debug' dist/signature.txt; then
            echo "::error::The APK is signed with a debug certificate."
            exit 1
          fi
          grep -q 'CN=MinTube' dist/signature.txt
          rm dist/signature.txt
          (cd dist && sha256sum "MinTube-$tag.apk" > "MinTube-$tag.apk.sha256")
          cat "dist/MinTube-$tag.apk.sha256"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/release-notes/$tag.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/notes.md"
            printf 'MinTube %s\n\nMinTube is a fork of Litube 4.0.0 by HydeYYHH (GPL-3.0).\n' "$tag" > "$notes"
          fi
          printf '\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 "dist/MinTube-$tag.apk.sha256")" >> "$notes"
          gh release create "$tag" "dist/MinTube-$tag.apk" "dist/MinTube-$tag.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "MinTube $tag" --notes-file "$notes" --verify-tag
